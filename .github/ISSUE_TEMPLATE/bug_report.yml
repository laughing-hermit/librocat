name: Bug report
description: Something in librocat doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A security problem goes privately instead, as SECURITY.md says.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - librocat.com (hosted)
        - A self-hosted librocat
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The agent and its version, for example Claude Code, Codex, Cursor, or Copilot.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: logs
    attributes:
      label: Logs or tool output
      description: Take out tokens and private content first.
      render: text
