name: e2e
# Every e2e suite (scripts/e2e.sh), on demand: Actions, e2e, Run workflow, on
# any branch. It runs on the runner alone: an anonymous local Convex backend,
# the fake AI Gateway, and the browser suite's exact steps. It costs nothing:
# no secret is passed, so no model is called and no cloud deployment is
# touched. Keep it that way: browser tests use locators, not agent steps.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e
  cancel-in-progress: true
env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # Plain output: e2e.sh reads each suite's "Tests" line.
  NO_COLOR: 1
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # reads the pnpm version from packageManager
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm run e2e
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/librocat-e2e.*/*.log
          retention-days: 3
          if-no-files-found: ignore
